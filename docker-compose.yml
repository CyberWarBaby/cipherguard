services:
  # ----------------------------------------------------------------------------
  # 1. Simulated Third-Party Logistics API (ShipFast)
  # ----------------------------------------------------------------------------
  shipfast-api:
    build:
      context: ./services/shipfast_api
      dockerfile: Dockerfile
    container_name: shipfast-api
    restart: unless-stopped
    volumes:
      - ./services/shipfast_api:/app
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - cipherguard-net

  # ----------------------------------------------------------------------------
  # 2. Simulated Third-Party Payments API (PayFlex - Multi-Vendor Proof)
  # ----------------------------------------------------------------------------
  payflex-api:
    build:
      context: ./services/payflex_api
      dockerfile: Dockerfile
    container_name: payflex-api
    restart: unless-stopped
    volumes:
      - ./services/payflex_api:/app
    ports:
      - "8006:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - cipherguard-net

  # ----------------------------------------------------------------------------
  # 3. CipherGuard Core Security & Analytics API
  # ----------------------------------------------------------------------------
  cipherguard-api:
    build:
      context: ./services/cipherguard_api
      dockerfile: Dockerfile
    container_name: cipherguard-api
    restart: unless-stopped
    volumes:
      - ./services/cipherguard_api:/app
    ports:
      - "8003:8001"
    environment:
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8000,http://127.0.0.1:3000,http://127.0.0.1:8000}
      - CIPHERGUARD_GATEWAY_URL=${CIPHERGUARD_GATEWAY_URL:-http://localhost:8000}
      - SHIPFAST_UPSTREAM_URL=${SHIPFAST_UPSTREAM_URL:-http://shipfast-api:8000}
      - PAYFLEX_UPSTREAM_URL=${PAYFLEX_UPSTREAM_URL:-http://payflex-api:8000}
      - ALLOW_INTERNAL_NETWORKS=${ALLOW_INTERNAL_NETWORKS:-true}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8001/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - cipherguard-net

  # ----------------------------------------------------------------------------
  # 4. Kong Gateway (DB-less Reverse Proxy Entrypoint)
  # ----------------------------------------------------------------------------
  kong:
    image: kong:3.6
    container_name: cipherguard-kong
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/declarative/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_LOG_LEVEL: info
    volumes:
      - ./gateway/kong.yml:/usr/local/kong/declarative/kong.yml:ro
    ports:
      - "8000:8000"   # Public Gateway Port for Frontend & API Consumers
      - "8005:8001"   # Kong Admin API
    depends_on:
      shipfast-api:
        condition: service_healthy
      payflex-api:
        condition: service_healthy
      cipherguard-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - cipherguard-net

networks:
  cipherguard-net:
    driver: bridge
